name: CafeLauncher syntax check

on:
  pull_request:
    paths:
      - 'cafe.bat'
      - '*.cfg'
      - 'profiles/*.json'
      - 'tools/Test-CafeLauncher.ps1'
      - 'tools/Test-StartupApiTimings.ps1'
      - 'tools/Test-GitHubRateLimit.ps1'
      - 'tools/Test-ProfileSave.ps1'
      - 'tools/Test-CfgSensitivitySync.ps1'
      - 'tools/Test-ProfileCfgSensitivity.ps1'
      - 'tools/Test-GitHubSyncAuth.ps1'
      - 'tools/Test-SteamLaunchOptions.ps1'
      - 'tools/Test-CS2GraphicsCapture.ps1'
      - 'tools/Test-CrosshairShareCode.ps1'
      - 'tools/Test-Graphics.ps1'
      - 'tools/Test-GraphicsHistory.ps1'
      - 'tools/Test-GraphicsHistoryAsync.ps1'
      - 'tools/Test-GraphicsHistoryUI.ps1'
      - 'tools/Test-SteamPathDiscovery.ps1'
      - 'tools/Test-WorkshopCleanup.ps1'
      - 'tools/fixtures/**'
      - 'tools/Test-NvidiaCompatibility.ps1'
      - 'tools/Test-NvidiaDvcFallback.ps1'
      - 'tools/Test-SuperlightDevice.ps1'
      - 'tools/Test-StepResults.ps1'
      - 'tools/Test-LogitechDPI.ps1'
      - 'tools/Test-EditorComboWheel.ps1'
      - 'tools/Update-Context.ps1'
      - 'tools/Test-ContextFreshness.ps1'
      - 'tools/Publish-CafeBatToDrive.ps1'
      - 'tools/google-drive-sync/**'
      - 'context.md'
      - 'README.md'
      - 'AGENTS.md'
      - '.githooks/**'
      - 'tools/Install-GitHooks.ps1'
      - 'tools/Auto-Bump-CafeRelease.ps1'
      - 'graphics/**'
      - '.github/workflows/cafe-syntax.yml'
  push:
    branches: [main]
    paths:
      - 'cafe.bat'
      - '*.cfg'
      - 'profiles/*.json'
      - 'tools/Test-CafeLauncher.ps1'
      - 'tools/Test-StartupApiTimings.ps1'
      - 'tools/Test-GitHubRateLimit.ps1'
      - 'tools/Test-ProfileSave.ps1'
      - 'tools/Test-CfgSensitivitySync.ps1'
      - 'tools/Test-ProfileCfgSensitivity.ps1'
      - 'tools/Test-GitHubSyncAuth.ps1'
      - 'tools/Test-SteamLaunchOptions.ps1'
      - 'tools/Test-CS2GraphicsCapture.ps1'
      - 'tools/Test-CrosshairShareCode.ps1'
      - 'tools/Test-Graphics.ps1'
      - 'tools/Test-GraphicsHistory.ps1'
      - 'tools/Test-GraphicsHistoryAsync.ps1'
      - 'tools/Test-GraphicsHistoryUI.ps1'
      - 'tools/Test-SteamPathDiscovery.ps1'
      - 'tools/Test-WorkshopCleanup.ps1'
      - 'tools/fixtures/**'
      - 'tools/Test-NvidiaCompatibility.ps1'
      - 'tools/Test-NvidiaDvcFallback.ps1'
      - 'tools/Test-SuperlightDevice.ps1'
      - 'tools/Test-StepResults.ps1'
      - 'tools/Test-LogitechDPI.ps1'
      - 'tools/Test-EditorComboWheel.ps1'
      - 'tools/Update-Context.ps1'
      - 'tools/Test-ContextFreshness.ps1'
      - 'tools/Publish-CafeBatToDrive.ps1'
      - 'tools/google-drive-sync/**'
      - 'context.md'
      - 'README.md'
      - 'AGENTS.md'
      - '.githooks/**'
      - 'tools/Install-GitHooks.ps1'
      - 'tools/Auto-Bump-CafeRelease.ps1'
      - 'graphics/**'
      - '.github/workflows/cafe-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core validation (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check README and project context match launcher release
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-ContextFreshness.ps1"
      - name: Check embedded PowerShell syntax and Windows line endings
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-CafeLauncher.ps1"
      - name: Test startup and API timing trace without network requests
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-StartupApiTimings.ps1"
      - name: Test GitHub API remaining display without extra requests
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-GitHubRateLimit.ps1"
  profiles:
    name: Profiles validation (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test profile save closure and local JSON roundtrip
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-ProfileSave.ps1"
      - name: Test GitHub profile CFG sync (mocked)
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-CfgSensitivitySync.ps1"
      - name: Require one valid sensitivity in every profile CFG
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-ProfileCfgSensitivity.ps1"
      - name: Test GitHub sync authentication worker and contract
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-GitHubSyncAuth.ps1"
  cs2:
    name: Cs2 validation (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test CS2 Steam launch option VDF updater
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-SteamLaunchOptions.ps1"
      - name: Test standalone CS2 graphics presets and editor
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-Graphics.ps1"
      - name: Test CS2 graphics capture
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-CS2GraphicsCapture.ps1"
      - name: Test CS2 crosshair share-code import
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-CrosshairShareCode.ps1"
      - name: Test graphics history
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-GraphicsHistory.ps1"
      - name: Test asynchronous graphics history worker
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-GraphicsHistoryAsync.ps1"
      - name: Test graphics history UI recovery
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-GraphicsHistoryUI.ps1"
      - name: Test Steam and CS2 path discovery
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-SteamPathDiscovery.ps1"
      - name: Test safe CS2 Workshop cleanup
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-WorkshopCleanup.ps1"
  hardware:
    name: Hardware validation (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test Logitech DPI controls and safety
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-LogitechDPI.ps1"
      - name: Test NVIDIA driver and display compatibility
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-NvidiaCompatibility.ps1"
      - name: Test legacy NVIDIA Digital Vibrance fallback without hardware writes
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-NvidiaDvcFallback.ps1"
      - name: Test Logitech Superlight device selection
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-SuperlightDevice.ps1"
  ui:
    name: Ui validation (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test editor dropdown scroll behavior
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-EditorComboWheel.ps1"
      - name: Test step status tracker and async results
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-StepResults.ps1"
  release-bump:
    name: Auto-bump launcher release
    runs-on: windows-latest
    timeout-minutes: 5
    concurrency:
      group: cafe-release-main
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.update-release.outputs.release_sha }}
    steps:
      - name: Check out current main and push history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Bump release only when cafe.bat changed without a newer marker
        id: update-release
        shell: powershell
        env:
          PREVIOUS_COMMIT: ${{ github.event.before }}
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Auto-Bump-CafeRelease.ps1" -PreviousCommit $env:PREVIOUS_COMMIT -EventCommit $env:EVENT_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Automatic release update failed.' }
          & "$env:GITHUB_WORKSPACE\tools\Test-CafeLauncher.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Launcher validation failed after release update.' }
          & "$env:GITHUB_WORKSPACE\tools\Test-ContextFreshness.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Generated release metadata validation failed.' }
          git add -- cafe.bat README.md context.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            "release_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
            exit 0
          }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: update CafeLauncher release metadata'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit the automatic release update.' }
          $maxPushAttempts = 5
          $pushed = $false
          for ($attempt = 1; $attempt -le $maxPushAttempts; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the latest main before pushing the release update.' }
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Could not rebase the release update onto the latest main.' }
            & "$env:GITHUB_WORKSPACE\tools\Test-CafeLauncher.ps1"
            if ($LASTEXITCODE -ne 0) { throw 'Launcher validation failed after rebasing the release update.' }
            & "$env:GITHUB_WORKSPACE\tools\Test-ContextFreshness.ps1"
            if ($LASTEXITCODE -ne 0) { throw 'Generated release metadata validation failed after rebasing.' }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              break
            }
            if ($attempt -lt $maxPushAttempts) {
              Write-Host "Release push raced with another main update; retrying ($attempt/$maxPushAttempts)."
              Start-Sleep -Seconds ([Math]::Min($attempt, 3))
            }
          }
          if (-not $pushed) { throw "Could not push the release update after $maxPushAttempts attempts." }
          "release_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
  publish-drive:
    name: Publish cafe.bat to Google Drive
    runs-on: ubuntu-latest
    needs: [core, profiles, cs2, hardware, ui, release-bump]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout full history for change detection
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-bump.outputs.release_sha || github.sha }}
      - name: Replace the existing Drive file
        shell: pwsh
        env:
          DRIVE_SYNC_URL: ${{ secrets.DRIVE_SYNC_URL }}
          DRIVE_SYNC_TOKEN: ${{ secrets.DRIVE_SYNC_TOKEN }}
        run: ./tools/Publish-CafeBatToDrive.ps1
