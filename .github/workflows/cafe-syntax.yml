name: CafeLauncher syntax check

on:
  pull_request:
    paths:
      - 'cafe.bat'
      - 'tools/Test-CafeLauncher.ps1'
      - 'tools/Test-GitHubRateLimit.ps1'
      - 'tools/Test-ProfileSave.ps1'
      - 'tools/Test-CfgSensitivitySync.ps1'
      - 'tools/Test-GitHubSyncAuth.ps1'
      - 'tools/Test-SteamLaunchOptions.ps1'
      - 'tools/Test-CS2GraphicsCapture.ps1'
      - 'tools/Test-Graphics.ps1'
      - 'tools/Test-GraphicsHistory.ps1'
      - 'tools/Test-GraphicsHistoryAsync.ps1'
      - 'tools/Test-SteamPathDiscovery.ps1'
      - 'tools/fixtures/**'
      - 'tools/Test-NvidiaCompatibility.ps1'
      - 'tools/Test-NvidiaDvcFallback.ps1'
      - 'tools/Test-SuperlightDevice.ps1'
      - 'tools/Test-StepResults.ps1'
      - 'tools/Test-LogitechDPI.ps1'
      - 'tools/Test-EditorComboWheel.ps1'
      - 'tools/Update-Context.ps1'
      - 'tools/Test-ContextFreshness.ps1'
      - 'context.md'
      - 'AGENTS.md'
      - '.githooks/**'
      - 'tools/Install-GitHooks.ps1'
      - 'graphics/**'
      - '.github/workflows/cafe-syntax.yml'
  push:
    branches: [main]
    paths:
      - 'cafe.bat'
      - 'tools/Test-CafeLauncher.ps1'
      - 'tools/Test-GitHubRateLimit.ps1'
      - 'tools/Test-ProfileSave.ps1'
      - 'tools/Test-CfgSensitivitySync.ps1'
      - 'tools/Test-GitHubSyncAuth.ps1'
      - 'tools/Test-SteamLaunchOptions.ps1'
      - 'tools/Test-CS2GraphicsCapture.ps1'
      - 'tools/Test-Graphics.ps1'
      - 'tools/Test-GraphicsHistory.ps1'
      - 'tools/Test-GraphicsHistoryAsync.ps1'
      - 'tools/Test-SteamPathDiscovery.ps1'
      - 'tools/fixtures/**'
      - 'tools/Test-NvidiaCompatibility.ps1'
      - 'tools/Test-NvidiaDvcFallback.ps1'
      - 'tools/Test-SuperlightDevice.ps1'
      - 'tools/Test-StepResults.ps1'
      - 'tools/Test-LogitechDPI.ps1'
      - 'tools/Test-EditorComboWheel.ps1'
      - 'tools/Update-Context.ps1'
      - 'tools/Test-ContextFreshness.ps1'
      - 'context.md'
      - 'AGENTS.md'
      - '.githooks/**'
      - 'tools/Install-GitHooks.ps1'
      - 'graphics/**'
      - '.github/workflows/cafe-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core validation (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check project context matches launcher release
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-ContextFreshness.ps1"
      - name: Check embedded PowerShell syntax and Windows line endings
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-CafeLauncher.ps1"
      - name: Test GitHub API remaining display without extra requests
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-GitHubRateLimit.ps1"
  profiles:
    name: Profiles validation (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test profile save closure and local JSON roundtrip
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-ProfileSave.ps1"
      - name: Test GitHub CFG sensitivity and JSON sync (mocked)
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-CfgSensitivitySync.ps1"
      - name: Test GitHub sync authentication worker and contract
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-GitHubSyncAuth.ps1"
  cs2:
    name: Cs2 validation (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test CS2 Steam launch option VDF updater
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-SteamLaunchOptions.ps1"
      - name: Test standalone CS2 graphics presets and editor
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-Graphics.ps1"
      - name: Test CS2 graphics capture
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-CS2GraphicsCapture.ps1"
      - name: Test graphics history
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-GraphicsHistory.ps1"
      - name: Test asynchronous graphics history worker
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-GraphicsHistoryAsync.ps1"
      - name: Test Steam and CS2 path discovery
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-SteamPathDiscovery.ps1"
  hardware:
    name: Hardware validation (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test Logitech DPI controls and safety
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-LogitechDPI.ps1"
      - name: Test NVIDIA driver and display compatibility
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-NvidiaCompatibility.ps1"
      - name: Test legacy NVIDIA Digital Vibrance fallback without hardware writes
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-NvidiaDvcFallback.ps1"
      - name: Test Logitech Superlight device selection
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-SuperlightDevice.ps1"
  ui:
    name: Ui validation (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test editor dropdown scroll behavior
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-EditorComboWheel.ps1"
      - name: Test step status tracker and async results
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\Test-StepResults.ps1"
