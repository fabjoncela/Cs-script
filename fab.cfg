echo "Fab Mode"

// ---------- CONSOLE ----------
bind "`" "toggleconsole"
bind "MOUSE3" "player_ping"
cl_teamcounter_playercount_instead_of_avatars false
// ---------- MOUSE / MOVEMENT ----------
bind "MWHEELUP" "+jump"
bind "MWHEELDOWN" "+jump"
bind "SPACE" "+jump"
sensitivity "1.2"
zoom_sensitivity_ratio "1.0"

// ---------- RADAR / HUD ----------
bind "ALT" "toggle cl_radar_scale 0.25 0.8"
cl_hud_radar_scale "1.30"

// ---------- WEAPONS ----------
bind "R" "+reload"
bind "X" "+lookatweapon"
bind "T" "slot6"        // HE grenade
bind "F" "slot7"        // Flashbang
bind "C" "slot8"        // Smoke
bind "N" "slot10"       // Molotov / Incendiary
unbind "z"
bind "g" "drop"

// ---------- VOICE ----------
bind "V" "+voicerecord"

// ---------- INCOMING CHAT ----------
bind "MOUSE5" "toggle cl_mute_enemy_team 1 0"

// ---------- CROSSHAIR ----------
cl_crosshair_drawoutline "0"
cl_crosshair_recoil "0"
cl_crosshair_sniper_width "0"
cl_crosshair_t "0"

cl_crosshaircolor_b "0"
cl_crosshaircolor_g "255"
cl_crosshaircolor_r "11"

cl_crosshairdot "0"
cl_crosshairstyle "4"

// ---------- PERFORMANCE ----------
fps_max "0"
r_low_latency "2"
r_player_visibility_mode "1"
cl_crosshair_dynamic_maxdist_splitratio "1"
cl_crosshair_dynamic_splitalpha_innermod "0"
cl_crosshair_dynamic_splitalpha_outermod "1"
cl_crosshair_dynamic_splitdist "3"
cl_crosshair_dynamic_spread_limit "227"
cl_crosshair_gap "1"
cl_crosshair_length "2"
cl_crosshair_screen_height "960"
cl_crosshair_thickness "2"
cl_crosshaircolor_a "255"
cl_crosshairoutline_a "255"
cl_crosshairoutline_b "0"
cl_crosshairoutline_g "0"
cl_crosshairoutline_r "0"
cl_ironsight_dot_scale "1"
cl_ironsight_usecrosshaircolor "0"
