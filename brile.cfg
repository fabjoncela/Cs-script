echo "Brile Mode"

// ---------- CONSOLE ----------
bind "`" "toggleconsole"

// ---------- MOUSE / MOVEMENT ----------
sensitivity "1.2"
zoom_sensitivity_ratio "1.0"
unbind "mwheelup"
unbind "mwheeldown"
bind "SPACE" "+jump"

// ---------- RADAR / HUD ----------
bind "ALT" "toggle cl_radar_scale 0.25 0.8"
cl_hud_radar_scale "1.30"

// ---------- WEAPONS ----------
bind "R" "+reload"
bind "F" "+lookatweapon"

bind "T" "slot6"        // HE grenade
bind "C" "slot8"        // Smoke
bind "N" "slot10"       // Molotov / Incendiary

// ---------- VOICE ----------
bind "V" "+voicerecord"

// ---------- INCOMING CHAT ----------

// ---------- CROSSHAIR ----------
cl_crosshair_drawoutline "2"
cl_crosshair_recoil "0"
cl_crosshair_sniper_width 0
cl_crosshair_t "0"

cl_crosshaircolor_b "255"
cl_crosshaircolor_g "0"
cl_crosshaircolor_r "242"

cl_crosshairdot "0"
cl_crosshairstyle "4"

// ---------- PERFORMANCE ----------
fps_max "400"
r_low_latency "2"
r_player_visibility_mode "1"
cl_crosshair_dynamic_maxdist_splitratio "1"
cl_crosshair_dynamic_splitalpha_innermod "1"
cl_crosshair_dynamic_splitalpha_outermod "0.45"
cl_crosshair_dynamic_splitdist "7"
cl_crosshair_dynamic_spread_limit "255"
cl_crosshair_gap "3"
cl_crosshair_length "3"
cl_crosshair_screen_height "1080"
cl_crosshair_thickness "1"
cl_crosshaircolor_a "255"
