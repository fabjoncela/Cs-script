// CS2 AUTOEXEC

echo "Arli Mode"
 
// ---------- CONSOLE ----------
bind "`" "toggleconsole"
 
 
// ---------- MOUSE / MOVEMENT ----------
bind "MWHEELUP" "+jump"
bind "CAPSLOCK" "switchhands"
bind "SPACE" "+jump"
 
sensitivity "1.2"
zoom_sensitivity_ratio "1.0"
 
// ---------- RADAR / HUD ----------
bind "ALT" "toggle cl_radar_scale 0.25 0.8"
cl_hud_radar_scale "1.30"
 
 
// ---------- WEAPONS ----------
bind "R" "+reload"
bind "F" "+lookatweapon" // Inspect a weapon
 
bind "T" "slot6" // HE grenade
bind "C" "slot8" // Smoke
bind "N" "slot10" // Molotov / Incendiary
 
// ---------- VOICE ----------
bind "V" "+voicerecord"
 
// ---------- INCOMING CHAT ----------

// ---------- CROSSHAIR ----------
// Intentionally unset until Arli's crosshair settings are confirmed.
 
// ---------- PERFORMANCE ----------
fps_max "400"
r_low_latency "2"
r_player_visibility_mode "1"
